# Opens pull requests when dependencies or GitHub Actions have updates, security fixes first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Smart App Control on the owner's laptop blocks Playwright 1.65's Chromium (D37).
      - dependency-name: playwright
        versions: ['>=1.65.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
