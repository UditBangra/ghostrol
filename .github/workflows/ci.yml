# Runs the same checks as `npm run check` and `npm run e2e` on every push and pull request.
name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      - name: Formatting
        run: npm run format:check

      - name: Types, lint, unit tests, build
        run: npm run check

      - name: Install Chromium for the browser checks
        run: node node_modules/playwright/cli.js install --with-deps chromium

      - name: Browser checks
        run: npm run e2e

      - name: Keep the built extension
        uses: actions/upload-artifact@v4
        with:
          name: ghostrol-dist
          path: dist/
          retention-days: 14
